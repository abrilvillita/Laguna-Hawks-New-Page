<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laguna Hawks · Panel</title>
<style>:root{--bg:#071510;--card:#102a22;--mint:#73efd4;--lime:#d9ff55;--text:#f6fff9;--muted:#9db8ad;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui}.shell{width:min(1100px,calc(100% - 32px));margin:auto;padding:35px 0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit}.card{background:var(--card);border:1px solid var(--line);padding:22px}.auth{max-width:440px;margin:10vh auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.row>*{width:100%;padding:11px;border:1px solid var(--line);background:#091c16;color:white}button{background:var(--lime)!important;color:#102a22!important;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.column h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mint)}.item{padding:15px;margin:9px 0;background:#0b211a;border:1px solid var(--line)}.item h3{margin:0 0 5px;font-size:1rem}.bar{height:4px;background:#183d31;margin-top:10px}.bar span{display:block;height:100%;background:var(--mint)}.hidden{display:none}.status{color:var(--mint)}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}}</style></head><body>
<main class="shell"><section id="setup" class="card auth"><h1>Laguna Hawks · Team Hub</h1><p class="muted">Configura el proyecto Supabase nuevo para activar acceso y tiempo real.</p><input id="url" placeholder="SUPABASE_URL"><input id="key" placeholder="SUPABASE_PUBLISHABLE_KEY"><button id="save">Guardar configuración local</button></section>
<section id="login" class="card auth hidden"><h1>Entrar al panel</h1><p class="muted">Solo integrantes autorizados.</p><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="signin">Entrar</button><p id="authmsg" class="status"></p></section>
<section id="app" class="hidden"><header><div><h1>Panel del proyecto</h1><small>Actualización colaborativa en tiempo real</small></div><button id="logout">Salir</button></header><form id="itemform" class="card row"><input id="title" required maxlength="120" placeholder="Nueva tarea, material o hito"><select id="kind"><option value="task">Tarea</option><option value="material">Material</option><option value="milestone">Hito</option><option value="update">Actualización</option></select><button>Agregar</button></form><p id="sync" class="status">Conectando…</p><div class="grid" id="board"></div></section></main>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';let sb;const $=s=>document.querySelector(s),statuses=['pending','in_progress','blocked','done'],labels={pending:'Pendiente',in_progress:'En proceso',blocked:'Bloqueado',done:'Terminado'};function init(){const url=localStorage.getItem('lh_url'),key=localStorage.getItem('lh_key');if(!url||!key)return;sb=createClient(url,key);$('#setup').classList.add('hidden');$('#login').classList.remove('hidden');sb.auth.getSession().then(({data})=>data.session&&open())}$('#save').onclick=()=>{localStorage.setItem('lh_url',$('#url').value.trim());localStorage.setItem('lh_key',$('#key').value.trim());location.reload()};$('#signin').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#authmsg').textContent=error?error.message:'Listo';if(!error)open()};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function open(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load();sb.channel('project-items').on('postgres_changes',{event:'*',schema:'public',table:'project_items'},load).subscribe(s=>$('#sync').textContent=s==='SUBSCRIBED'?'Sincronizado en tiempo real':'Conectando…')}async function load(){const{data,error}=await sb.from('project_items').select('*').order('updated_at',{ascending:false});if(error){$('#sync').textContent=error.message;return}$('#board').innerHTML=statuses.map(s=>'<section class="column"><h2>'+labels[s]+'</h2>'+data.filter(x=>x.status===s).map(item).join('')+'</section>').join('')}function item(x){return '<article class="item" data-id="'+x.id+'"><h3>'+esc(x.title)+'</h3><small>'+esc(x.kind)+'</small><div class="bar"><span style="width:'+x.progress+'%"></span></div><select class="move">'+statuses.map(s=>'<option '+(s===x.status?'selected':'')+' value="'+s+'">'+labels[s]+'</option>').join('')+'</select></article>'}document.addEventListener('change',async e=>{if(!e.target.classList.contains('move'))return;const id=e.target.closest('.item').dataset.id;const{data:{user}}=await sb.auth.getUser();await sb.from('project_items').update({status:e.target.value,progress:e.target.value==='done'?100:50,updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',id)});$('#itemform').onsubmit=async e=>{e.preventDefault();const{data:{user}}=await sb.auth.getUser();await sb.from('project_items').insert({title:$('#title').value.trim(),kind:$('#kind').value,created_by:user.id,updated_by:user.id});$('#title').value=''};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
